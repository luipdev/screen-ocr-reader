[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-ocr-reader"
version = "2.0.0"
description = "Read a number or text from a region of a desktop window with EasyOCR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fredy Portilla" }]
dependencies = []

[project.optional-dependencies]
ocr = ["easyocr>=1.7", "opencv-python>=4.8", "numpy", "pyautogui>=0.9", "pygetwindow>=0.0.9"]
dev = ["pytest>=8"]

[project.scripts]
screen-ocr = "screen_ocr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
